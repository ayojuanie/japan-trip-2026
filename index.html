<style>
:root{--red:#e63946;--pink:#ffb7c5;--gold:#ffd166;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;color:#fff;
 font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
 background:linear-gradient(180deg,#120726 0%,#2b0f4a 32%,#7a1f5c 58%,#e2546b 76%,#ff9a62 90%,#ffc87a 100%);background-attachment:fixed;}
.scene{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stars{position:absolute;inset:0 0 45% 0}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.sun{position:absolute;left:50%;bottom:24%;width:min(60vw,340px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
 background:radial-gradient(circle at 50% 45%,#ff6b6b,#e63946 60%,#c1121f);box-shadow:0 0 80px 20px rgba(230,57,70,.45);animation:glow 5s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 60px 14px rgba(230,57,70,.4)}50%{box-shadow:0 0 110px 30px rgba(255,120,90,.55)}}
.land{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;overflow:visible}
.wrap{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
 padding:calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 24px);text-align:center}
.jp{font-family:"Dela Gothic One","Hiragino Sans",sans-serif;letter-spacing:.35em;color:var(--pink);font-size:clamp(14px,3.8vw,18px);
 text-shadow:0 0 12px rgba(255,183,197,.7);margin-bottom:10px;padding-left:.35em}
h1{font-family:"Dela Gothic One","Hiragino Sans",system-ui,sans-serif;font-weight:900;line-height:1.05;
 font-size:clamp(34px,10.5vw,76px);max-width:900px;
 background:linear-gradient(180deg,#fff 0%,#ffe3ea 55%,#ffb7c5 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 4px 0 rgba(193,18,31,.9)) drop-shadow(0 10px 22px rgba(0,0,0,.45));}
.date{margin-top:14px;display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:8px 16px;border-radius:999px;font-weight:700;font-size:clamp(14px,4vw,17px)}
.cd{margin-top:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.5vw,18px);width:100%;max-width:640px}
.u{background:linear-gradient(180deg,rgba(26,11,46,.78),rgba(60,15,60,.72));border:2px solid rgba(255,183,197,.35);border-radius:18px;
 padding:clamp(12px,3.5vw,22px) 4px clamp(10px,3vw,16px);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15);
 backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:relative;overflow:hidden}
.u::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--red)}
.n{font-family:"Dela Gothic One",system-ui,sans-serif;font-size:clamp(30px,10vw,64px);line-height:1;font-variant-numeric:tabular-nums;
 color:#fff;text-shadow:0 0 18px rgba(255,107,107,.6);display:inline-block}
.n.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.18);color:var(--gold)}100%{transform:scale(1)}}
.l{margin-top:6px;font-size:clamp(10px,2.9vw,13px);letter-spacing:.12em;text-transform:uppercase;color:#ffd6de;font-weight:700}
.l b{display:block;font-size:1.15em;letter-spacing:.05em;color:var(--pink);font-weight:700;margin-bottom:1px}
.tag{margin-top:22px;font-size:clamp(15px,4.4vw,19px);font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.tag span{color:var(--gold)}
.done{display:none;margin-top:30px;font-family:"Dela Gothic One",system-ui,sans-serif;font-size:clamp(28px,8.5vw,56px);line-height:1.2;
 text-shadow:0 4px 0 #c1121f,0 10px 30px rgba(0,0,0,.4);animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.arrived .cd{display:none}.arrived .done{display:block}
.spacer{flex:1;min-height:38vh}
footer{font-size:12px;color:rgba(255,255,255,.75);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.petal{position:fixed;top:-24px;z-index:1;pointer-events:none;width:14px;height:11px;border-radius:14px 0 14px 0;
 background:linear-gradient(135deg,#ffd1dc,#ff9fb5);opacity:.9;will-change:transform;animation:fall linear forwards}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--dx),110vh,0) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.petal,.star,.sun,.done{animation:none}.n.pop{animation:none}}
@media (min-width:900px){.spacer{min-height:30vh}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
 <div class="stars" id="stars"></div>
 <div class="sun"></div>
 <svg class="land" id="land" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMax slice">
  <defs>
   <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1d52"/><stop offset="1" stop-color="#1a0b2e"/></linearGradient>
   <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22103a"/><stop offset="1" stop-color="#0d0618"/></linearGradient>
  </defs>
  <path d="M-700 500 L-700 425 C-250 415 160 385 380 250 L520 120 C560 95 640 95 680 120 L820 250 C1040 385 1450 415 1900 425 L1900 500 Z" fill="url(#fuji)"/>
  <path d="M520 120 C560 95 640 95 680 120 L735 172 L705 160 L680 182 L650 158 L620 186 L590 160 L560 180 L530 162 L465 172 Z" fill="#f4f1fb"/>
  <path d="M-700 500 L-700 440 C-500 428 -250 452 0 440 C120 420 220 445 330 430 C450 412 520 455 640 445 C780 432 880 410 1000 428 C1090 440 1150 430 1200 425 C1400 418 1650 448 1900 432 L1900 500 Z" fill="url(#hill)"/>
  <g transform="translate(905 300)" fill="#c1121f">
   <rect x="-125" y="0" width="250" height="18" rx="6"/>
   <path d="M-150 -16 Q0 -2 150 -16 L145 4 Q0 14 -145 4 Z" fill="#e63946"/>
   <rect x="-100" y="40" width="200" height="12"/>
   <rect x="-95" y="0" width="20" height="200"/><rect x="75" y="0" width="20" height="200"/>
   <rect x="-9" y="18" width="18" height="24"/>
   <rect x="-102" y="190" width="34" height="12" fill="#1a0b2e"/><rect x="68" y="190" width="34" height="12" fill="#1a0b2e"/>
  </g>
 </svg>
</div>

<main class="wrap" id="app">
 <div class="jp">日本 · カウントダウン</div>
 <h1>End of the Year Japan Trip 2026</h1>
 <div class="date">✈️ Departing Sun, Nov 29, 2026</div>
 <div class="cd" role="timer" aria-live="off">
  <div class="u"><div class="n" id="d">--</div><div class="l"><b>日</b>Days</div></div>
  <div class="u"><div class="n" id="h">--</div><div class="l"><b>時間</b>Hours</div></div>
  <div class="u"><div class="n" id="m">--</div><div class="l"><b>分</b>Minutes</div></div>
  <div class="u"><div class="n" id="s">--</div><div class="l"><b>秒</b>Seconds</div></div>
 </div>
 <div class="done">We're going to Japan! 🇯🇵<br>行ってきます!</div>
 <p class="tag" id="tag">Pack your bags — <span>Tokyo</span> is calling 🍣🗼</p>
 <div class="spacer"></div>
 <footer>⛩️ もうすぐ日本! · See you in Japan</footer>
</main>

<script>
(function(){
 var TARGET=new Date("2026-11-29T00:00:00-08:00").getTime();
 var app=document.getElementById("app"),els={d:document.getElementById("d"),h:document.getElementById("h"),m:document.getElementById("m"),s:document.getElementById("s")};
 var prev={},burst=false;
 function pad(n){return n<10?"0"+n:""+n}
 function set(k,v){if(prev[k]===v)return;prev[k]=v;var e=els[k];e.textContent=v;e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}
 function tick(){
  var diff=TARGET-Date.now();
  if(diff<=0){app.classList.add("arrived");document.getElementById("tag").textContent="Have the best trip ever! 🍜🎌";
   if(!burst){burst=true;for(var i=0;i<60;i++)setTimeout(petal,i*40)}return false}
  var t=Math.floor(diff/1000);
  set("d",""+Math.floor(t/86400));set("h",pad(Math.floor(t%86400/3600)));set("m",pad(Math.floor(t%3600/60)));set("s",pad(t%60));
  return true}
 tick();
 (function loop(){var ok=tick();setTimeout(loop,1000-(Date.now()%1000)+5)})();
 document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});
 // fit landscape: fill on phones, keep Fuji in proportion on wide screens
 var land=document.getElementById("land");
 function fit(){var r=land.getBoundingClientRect();land.setAttribute("preserveAspectRatio",(r.width/Math.max(r.height,1))>2.4?"xMidYMax meet":"xMidYMax slice")}
 fit();window.addEventListener("resize",fit);
 // stars
 var st=document.getElementById("stars");
 for(var i=0;i<60;i++){var s=document.createElement("i");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";
  s.style.animationDelay=(Math.random()*3)+"s";var z=Math.random()<.2?3:2;s.style.width=s.style.height=z+"px";st.appendChild(s)}
 // sakura
 var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches,live=0,MAX=window.innerWidth<600?18:32;
 function petal(){
  if(live>=MAX+40)return;var p=document.createElement("div");p.className="petal";live++;
  var sz=8+Math.random()*10,dur=7+Math.random()*7;
  p.style.left=(Math.random()*105-5)+"vw";p.style.width=sz+"px";p.style.height=sz*.78+"px";
  p.style.setProperty("--dx",(Math.random()*160-40)+"px");p.style.setProperty("--r",(Math.random()*720-360)+"deg");
  p.style.animationDuration=dur+"s";p.style.opacity=.55+Math.random()*.45;
  p.addEventListener("animationend",function(){p.remove();live--});document.body.appendChild(p)}
 if(!reduce){for(var j=0;j<6;j++)setTimeout(petal,j*300);setInterval(function(){if(!document.hidden&&live<MAX)petal()},550)}
})();
</script>
</body>
</html>
